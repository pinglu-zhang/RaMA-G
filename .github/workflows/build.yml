name: Build and public tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        centromere: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git zlib1g-dev python3 samtools
      - name: Configure
        run: >-
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DRAMAG_BUILD_TESTS=ON
          -DRAMAG_WARNINGS_AS_ERRORS=ON
          -DRAMAG_ENABLE_CENTROMERE=${{ matrix.centromere }}
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test product contracts and installed APIs
        run: ctest --test-dir build/ci -L public --output-on-failure --no-tests=error
